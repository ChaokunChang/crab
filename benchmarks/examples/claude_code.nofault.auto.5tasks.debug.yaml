scenario: fault
mode: auto
provider: openai
agent: claude_code
llm_service: claude_code_trace_replay
task_dataset: /root/workspace/agent-cr/results/datasets/claude_code_replay_benchmark_first5.jsonl
sandboxes: 5
max_workers: 5
phase_workers:
  setup: 5
  run: 5
  verification: 5
executor:
  checkpoint_workers: 5
  restore_workers: 5
  checkpoint_queue_size: 10000
  max_retries: 0
  retry_backoff_seconds: 0.05
  coordination_workers: 5
  composite_step_workers: 5
scheduler:
  min_checkpoint_interval_seconds: 0.0
  force_checkpoint_after_seconds: 0.0
  require_change_signal: true
  prefer_checkpoint_during_llm_request: true
  require_llm_request_for_checkpoint: false
  inspect_without_pause: false
llm_server:
  launch_mode: process
host_inspector:
  launch_mode: process
iterations: 1
output: /root/workspace/agent-cr/logs/claude_code.nofault.auto.5tasks.debug.csv
log_file: /root/workspace/agent-cr/logs/claude_code.nofault.auto.5tasks.debug.log
log_file_mode: write
telemetry:
  output: /root/workspace/agent-cr/logs/claude_code.nofault.auto.5tasks.debug.telemetry.jsonl
  detail_level: detailed
  capture_command_output: false
  max_text_attribute_bytes: 2048
  keep_in_memory_copy: false
  writer_mode: async
  queue_capacity: 16384000
  batch_max_records: 256000
  flush_interval_ms: 50
  overflow_policy: drop_new
  serializer: auto
  report:
    enabled: true
    output_dir: /root/workspace/agent-cr/logs/claude_code.nofault.auto.5tasks.debug.report
    top_k: 50
    log_scale_charts: false
    export_svg: true
monitoring:
  enabled: true
  sample_interval_ms: 1000
  include_host: true
  include_sandboxes: true
zpool_name: zfspool
reuse_zpool: true
benchmark_root: /root/workspace/agent-cr/data/agent_cr/results
log_level: info
scenario_options:
  injection_rate: 0.0
  first_forced_event_chunk: 0
llm_service_options:
  response_delay_policy: trace_replay
  response_delay_scaling_factor: 0.0
