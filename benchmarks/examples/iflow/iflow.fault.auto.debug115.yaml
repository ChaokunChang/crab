scenario: fault
mode: auto
provider: openai
agent: iflow
llm_service: iflow_trace_replay
task_dataset: /root/workspace/crab/results/datasets/termnius_iflow_replay_x115.jsonl
sandboxes: 115
max_workers: 32
phase_workers:
  setup: 32
  run: 32
  verification: 32
executor:
  checkpoint_workers: 32
  restore_workers: 32
  checkpoint_queue_size: 10000
  max_retries: 0
  retry_backoff_seconds: 0.05
scheduler:
  min_checkpoint_interval_seconds: 0.0
  force_checkpoint_after_seconds: 0.0
  require_change_signal: true
  prefer_checkpoint_during_llm_request: true
  require_llm_request_for_checkpoint: false
  inspect_without_pause: false
llm_server:
  launch_mode: process
iterations: 10
output: ../../logs/iflow.fault.auto.debug115.2.csv
log_file: ../../logs/iflow.fault.auto.debug115.2.log
telemetry:
  output: ../../logs/iflow.fault.auto.debug115.2.telemetry.jsonl
  detail_level: detailed
  capture_command_output: false
  max_text_attribute_bytes: 2048
  report:
    enabled: true
    output_dir: ../../logs/iflow.fault.auto.debug115.2.report
    top_k: 25
    log_scale_charts: false
    export_svg: true
monitoring:
  enabled: true
  sample_interval_ms: 1000
  include_host: true
  include_sandboxes: true
zpool_size: 150G
zpool_name: crabbench-150
zpool_image: /root/workspace/crab/data/crab/results/zpool/crabbench-150.zpool.img
reuse_zpool: true
benchmark_root: /root/workspace/crab/data/crab/results
log_level: debug
scenario_options:
  injection_rate: 0.0
  first_forced_event_chunk: 5
llm_service_options:
  response_delay_policy: trace_replay
  response_delay_scaling_factor: 1.0