scenario: spot
mode: auto
provider: openai
agent: iflow
llm_service: iflow_trace_replay
task_dataset: /root/workspace/crab/results/datasets/termnius_iflow_replay_128tasks_light_medium.jsonl
sandboxes: 256
max_workers: 64
phase_workers:
  setup: 64
  run: 64
  verification: 32
# phase_merging:
#   setup_and_run: true
# verification:
#   enabled: false
executor:
  checkpoint_workers: 64
  restore_workers: 64
  checkpoint_queue_size: 10000
  checkpoint_scheduling_policy: reactive
  reactive_checkpoint_urgent_quota: 40000
  max_retries: 0
  retry_backoff_seconds: 0.05
  coordination_workers: 64
  composite_step_workers: 64
scheduler:
  min_checkpoint_interval_seconds: 0.0
  force_checkpoint_after_seconds: 0.0
  require_change_signal: true
  prefer_checkpoint_during_llm_request: true
  require_llm_request_for_checkpoint: false
  inspect_without_pause: false
  checkpoint_full_baseline_on_first_checkpoint: false
llm_server:
  launch_mode: process
host_inspector:
  launch_mode: process
iterations: 10
output: /root/workspace/crab/logs/iflow/spot.auto.5tasks.debug.fifo.1.csv
log_file: /root/workspace/crab/logs/iflow/spot.auto.5tasks.debug.fifo.1.log
log_file_mode: write
telemetry:
  output: /root/workspace/crab/logs/iflow/spot.auto.5tasks.debug.fifo.1.telemetry.jsonl
  file_mode: write
  detail_level: detailed
  capture_command_output: false
  max_text_attribute_bytes: 2048
  keep_in_memory_copy: false
  writer_mode: async
  queue_capacity: 16384000
  batch_max_records: 256000
  flush_interval_ms: 50
  overflow_policy: drop_new
  serializer: auto
  report:
    enabled: true
    output_dir: /root/workspace/crab/logs/iflow/spot.auto.5tasks.debug.fifo.1.report
    top_k: 50
    log_scale_charts: false
    export_svg: true
monitoring:
  enabled: true
  sample_interval_ms: 1000
  include_host: true
  include_sandboxes: true
zpool_name: zfspool
reuse_zpool: true
# benchmark_root: /root/workspace/crab/data/crab/results
benchmark_root: /mnt/data2
# zpool_size: 150G
# zpool_name: crabbench-150
# zpool_image: /root/workspace/crab/data/crab/results/zpool/crabbench-150.zpool.img
# reuse_zpool: true
# benchmark_root: /root/workspace/crab/data/crab/results
log_level: debug
scenario_options:
  injection_rate: 0.0
  first_forced_event_chunk: 5
llm_service_options:
  response_delay_policy: trace_replay
  response_delay_scaling_factor: 0.1
