scenario: fault
mode: auto
provider: openai
agent: terminus
llm_service: terminus_trace_replay
task_dataset: bg-server-state-dataset.jsonl
sandboxes: 1
max_workers: 1
phase_workers:
  setup: 1
  run: 1
  verification: 1
verification_enabled: false
executor:
  checkpoint_workers: 2
  restore_workers: 2
  checkpoint_queue_size: 64
  checkpoint_scheduling_policy: fifo
  reactive_checkpoint_urgent_quota: 2
  max_retries: 0
  retry_backoff_seconds: 0.05
  coordination_workers: 2
  composite_step_workers: 2
scheduler:
  min_checkpoint_interval_seconds: 0.0
  force_checkpoint_after_seconds: 0.0
  require_change_signal: true
  checkpoint_full_baseline_on_first_checkpoint: true
  prefer_checkpoint_during_llm_request: true
  require_llm_request_for_checkpoint: false
  inspect_without_pause: false
llm_server:
  launch_mode: process
host_inspector:
  launch_mode: process
  log_level: DEBUG
  log_file: true
iterations: 1
output: ../../../logs/terminus/bgserver.smoke.csv
log_file: ../../../logs/terminus/bgserver.smoke.log
log_file_mode: write
telemetry:
  output: ../../../logs/terminus/bgserver.smoke.telemetry.jsonl
  file_mode: write
  detail_level: detailed
  capture_command_output: false
  max_text_attribute_bytes: 2048
  keep_in_memory_copy: false
  writer_mode: async
  queue_capacity: 1638400
  batch_max_records: 25600
  flush_interval_ms: 50
  overflow_policy: drop_new
  serializer: auto
  report:
    enabled: false
    output_dir: ../../../logs/terminus/bgserver.smoke.report
    top_k: 50
    log_scale_charts: false
    export_svg: false
monitoring:
  enabled: true
  sample_interval_ms: 1000
  include_host: true
  include_sandboxes: true
zpool_name: zfspool
reuse_zpool: true
benchmark_root: ../../../data/crab/results
log_level: debug
max_agent_timeout_scale: 2.0
scenario_options:
  injection_rate: 0.0
  first_forced_event_chunk: 0
llm_service_options:
  response_delay_policy: trace_replay
  response_delay_scaling_factor: 1.0
