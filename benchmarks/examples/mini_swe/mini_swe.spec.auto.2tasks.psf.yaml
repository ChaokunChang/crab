scenario: spec
mode: auto
provider: openai
agent: mini_swe
llm_service: mini_swe_spec_trace_replay
task_dataset: ../../../results/datasets/swebench_miniswe_replay.psf2.jsonl
sandboxes: 2
max_workers: 2
phase_workers:
  setup: 2
  run: 2
  verification: 2
phase_merging:
  setup_and_run: true
  setup_and_run_executor_pool: shared
verification:
  enabled: true
executor:
  checkpoint_workers: 4
  restore_workers: 4
  checkpoint_queue_size: 1024
  max_retries: 0
  retry_backoff_seconds: 0.05
  coordination_workers: 4
  composite_step_workers: 4
scheduler:
  min_checkpoint_interval_seconds: 0.0
  force_checkpoint_after_seconds: 0.0
  require_change_signal: true
  prefer_checkpoint_during_llm_request: true
  require_llm_request_for_checkpoint: false
  inspect_without_pause: false
  checkpoint_full_baseline_on_first_checkpoint: true
llm_server:
  launch_mode: process
host_inspector:
  launch_mode: process
  log_level: INFO
  log_file: true
iterations: 0
output: ../../../logs/mini_swe/spec.auto.2tasks.psf.csv
log_file: ../../../logs/mini_swe/spec.auto.2tasks.psf.log
log_file_mode: write
telemetry:
  output: ../../../logs/mini_swe/spec.auto.2tasks.psf.telemetry.jsonl
  file_mode: write
  detail_level: detailed
  capture_command_output: false
  max_text_attribute_bytes: 2048
  keep_in_memory_copy: false
  writer_mode: async
  queue_capacity: 1048576
  batch_max_records: 32768
  flush_interval_ms: 50
  overflow_policy: drop_new
  serializer: auto
  report:
    enabled: false
    output_dir: ../../../logs/mini_swe/spec.auto.2tasks.psf.report
    top_k: 10
    log_scale_charts: false
    export_svg: false
monitoring:
  enabled: false
  sample_interval_ms: 1000
  include_host: true
  include_sandboxes: true
reuse_zpool: true
benchmark_root: ../../../data/crab/results
zpool_size: 300G
zpool_name: crabbench-300
zpool_image: ../../../data/crab/results/zpool/crabbench-300G.zpool.img
runtime_command_timeout_seconds: 300
runtime_zfs_prepare_timeout_seconds: 900
log_level: debug
scenario_options:
  acceptance_rate: 0.5
  draft_response_delay_scaling_factor: 0.1
  mismatch_policy: preserve_command_class
llm_service_options:
  response_delay_policy: trace_replay
  response_delay_scaling_factor: 1.0
