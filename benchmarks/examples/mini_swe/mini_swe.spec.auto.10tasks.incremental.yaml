scenario: spec
mode: auto
provider: openai
agent: mini_swe
llm_service: mini_swe_spec_trace_replay
task_dataset: /root/workspace/crab/results/datasets/swebench_miniswe_replay.jsonl
sandboxes: 10
max_workers: 10
phase_workers:
  setup: 10
  run: 10
  verification: 10
phase_merging:
  setup_and_run: true
  setup_and_run_executor_pool: shared
verification:
  enabled: true
executor:
  checkpoint_workers: 10
  restore_workers: 10
  checkpoint_queue_size: 10000
  max_retries: 0
  retry_backoff_seconds: 0.05
  coordination_workers: 10
  composite_step_workers: 10
scheduler:
  min_checkpoint_interval_seconds: 0.0
  force_checkpoint_after_seconds: 0.0
  require_change_signal: true
  prefer_checkpoint_during_llm_request: true
  require_llm_request_for_checkpoint: false
  inspect_without_pause: false
  checkpoint_full_baseline_on_first_checkpoint: true
  # Opt into CRIU incremental process checkpointing. Required for
  # chain-ancestor sharing to have anything to share — the leaf
  # checkpoint is small (just the delta) and the chain ancestors live in
  # the source's runtime tree, ready to be symlinked into the fork.
  incremental_process_enabled: true
  full_process_checkpoint_interval: 8
  max_process_chain_length: 16
llm_server:
  launch_mode: process
host_inspector:
  launch_mode: process
iterations: 0
output: /root/workspace/crab/logs/mini_swe/spec.auto.10tasks.incremental.csv
log_file: /root/workspace/crab/logs/mini_swe/spec.auto.10tasks.incremental.log
log_file_mode: write
telemetry:
  output: /root/workspace/crab/logs/mini_swe/spec.auto.10tasks.incremental.telemetry.jsonl
  file_mode: write
  detail_level: detailed
  capture_command_output: false
  max_text_attribute_bytes: 2048
  keep_in_memory_copy: false
  writer_mode: async
  queue_capacity: 16384000
  batch_max_records: 256000
  flush_interval_ms: 50
  overflow_policy: drop_new
  serializer: auto
  report:
    enabled: true
    output_dir: /root/workspace/crab/logs/mini_swe/spec.auto.10tasks.incremental.report
    top_k: 50
    log_scale_charts: false
    export_svg: true
monitoring:
  enabled: true
  sample_interval_ms: 1000
  include_host: true
  include_sandboxes: true
reuse_zpool: true
benchmark_root: /root/workspace/crab/data/crab/results
zpool_size: 200G
zpool_name: crabbench-200
zpool_image: /root/workspace/crab/data/crab/results/zpool/crabbench-200G.zpool.img
runtime_command_timeout_seconds: 300
runtime_zfs_prepare_timeout_seconds: 900
log_level: debug
scenario_options:
  acceptance_rate: 0.5
  draft_response_delay_scaling_factor: 0.1
  mismatch_policy: preserve_command_class
  # Phase B: replace per-fork ancestor copytree with runtime-level
  # symlinks into the source's checkpoint tree. Pin the chain via the
  # storage retention layer so the source can't prune ancestors mid-fork.
  enable_fork_chain_sharing: true
  # Phase A: speculatively prep a fork after each successful checkpoint
  # on the active sandbox. The next ensure_fork() call returns the warm
  # fork instead of paying clone+restore on the agent's critical path.
  enable_background_prefork: true
  prefork_min_interval_seconds: 0.5
  prefork_wait_timeout_seconds: 0.05
  # Phase D: pass --lazy-pages to runc restore so the restored process
  # starts running once metadata + a small eager set is loaded; the rest
  # streams in via userfaultfd. Especially valuable for spec scenarios
  # where many forks are discarded after the oracle decision and never
  # touch most of their pages.
  enable_lazy_restore: true
llm_service_options:
  response_delay_policy: trace_replay
  response_delay_scaling_factor: 1.0
