scenario: e2e
mode: manual
provider: openai
agent: mini_swe
llm_service: mini_swe_trace_replay
task_dataset: ../../../results/datasets/swebench_sweagent_replay_first10.jsonl
sandboxes: 10
max_workers: 4
phase_workers:
  setup: 4
  run: 4
  verification: 4
llm_server:
  launch_mode: process
host_inspector:
  launch_mode: process
iterations: 1
output: ../../../logs/mini_swe/e2e.manual.10tasks.debug.csv
log_file: ../../../logs/mini_swe/e2e.manual.10tasks.debug.log
log_file_mode: write
telemetry:
  output: ../../../logs/mini_swe/e2e.manual.10tasks.debug.telemetry.jsonl
  detail_level: detailed
  capture_command_output: false
  max_text_attribute_bytes: 2048
  keep_in_memory_copy: false
  writer_mode: async
  queue_capacity: 16384000
  batch_max_records: 256000
  flush_interval_ms: 50
  overflow_policy: drop_new
  serializer: auto
  report:
    enabled: true
    output_dir: ../../../logs/mini_swe/e2e.manual.10tasks.debug.report
    top_k: 50
    log_scale_charts: false
    export_svg: true
monitoring:
  enabled: true
  sample_interval_ms: 1000
  include_host: true
  include_sandboxes: true
zpool_name: zfspool
reuse_zpool: true
benchmark_root: ../../../data/crab/results
log_level: info
llm_service_options:
  response_delay_policy: trace_replay
  response_delay_scaling_factor: 1.0
