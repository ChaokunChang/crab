scenario: fault
mode: auto
provider: openai
agent: mini_swe
llm_service: mini_swe_trace_replay
task_dataset: ../../../results/datasets/swebench_miniswe_replay.jsonl
sandboxes: 10
max_workers: 5
phase_workers:
  setup: 5
  run: 5
  verification: 16
rootfs_reuse:
  enabled: true
phase_merging:
  setup_and_run: true
verification:
  enabled: true
executor:
  checkpoint_workers: 5
  restore_workers: 5
  checkpoint_queue_size: 10000
  max_retries: 0
  retry_backoff_seconds: 0.05
  coordination_workers: 5
  composite_step_workers: 5
scheduler:
  min_checkpoint_interval_seconds: 0.0
  force_checkpoint_after_seconds: 0.0
  require_change_signal: true
  prefer_checkpoint_during_llm_request: true
  require_llm_request_for_checkpoint: false
  inspect_without_pause: false
  checkpoint_full_baseline_on_first_checkpoint: false
llm_server:
  launch_mode: process
host_inspector:
  launch_mode: process
iterations: 10
output: ../../../logs/mini_swe/nofault.auto.10tasks.debug.csv
log_file: ../../../logs/mini_swe/nofault.auto.10tasks.debug.log
log_file_mode: write
telemetry:
  output: ../../../logs/mini_swe/nofault.auto.10tasks.debug.telemetry.jsonl
  file_mode: write
  detail_level: detailed
  capture_command_output: false
  max_text_attribute_bytes: 2048
  keep_in_memory_copy: false
  writer_mode: async
  queue_capacity: 16384000
  batch_max_records: 256000
  flush_interval_ms: 50
  overflow_policy: drop_new
  serializer: auto
  report:
    enabled: true
    output_dir: ../../../logs/mini_swe/nofault.auto.10tasks.debug.report
    top_k: 50
    log_scale_charts: false
    export_svg: true
monitoring:
  enabled: true
  sample_interval_ms: 1000
  include_host: true
  include_sandboxes: true
reuse_zpool: true
benchmark_root: ../../../data/crab/results
zpool_size: 20G
zpool_name: crabbench-20
zpool_image: ../../../data/crab/results/zpool/crabbench-20G.zpool.img
runtime_command_timeout_seconds: 300
runtime_zfs_prepare_timeout_seconds: 900
log_level: debug
scenario_options:
  injection_rate: 0.0
  first_forced_event_chunk: 0
llm_service_options:
  response_delay_policy: trace_replay
  response_delay_scaling_factor: 1.0
