scenario: e2e
mode: manual
provider: openai
agent: terminus
llm_service: terminus_trace_replay
task_dataset: /root/workspace/agent-cr/results/datasets/terminus_replay.jsonl
sandboxes: 10
max_workers: 10
phase_workers:
  setup: 10
  run: 10
  verification: 10
llm_server:
  launch_mode: process
host_inspector:
  launch_mode: process
iterations: 1
output: /root/workspace/agent-cr/logs/terminus/e2e.manual.10tasks.debug.fast.csv
log_file: /root/workspace/agent-cr/logs/terminus/e2e.manual.10tasks.debug.fast.log
log_file_mode: write
telemetry:
  output: /root/workspace/agent-cr/logs/terminus/e2e.manual.10tasks.debug.fast.telemetry.jsonl
  detail_level: detailed
  capture_command_output: false
  max_text_attribute_bytes: 2048
  keep_in_memory_copy: false
  writer_mode: async
  queue_capacity: 16384000
  batch_max_records: 256000
  flush_interval_ms: 50
  overflow_policy: drop_new
  serializer: auto
  report:
    enabled: true
    output_dir: /root/workspace/agent-cr/logs/terminus/e2e.manual.10tasks.debug.fast.report
    top_k: 50
    log_scale_charts: false
    export_svg: true
monitoring:
  enabled: true
  sample_interval_ms: 1000
  include_host: true
  include_sandboxes: true
zpool_name: zfspool
reuse_zpool: true
benchmark_root: /root/workspace/agent-cr/data/agent_cr/results
log_level: debug
llm_service_options:
  response_delay_policy: fixed
  response_delay_ms: 250
