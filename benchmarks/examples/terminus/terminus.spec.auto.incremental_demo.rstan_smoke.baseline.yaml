scenario: spec
mode: auto
provider: openai
agent: terminus
llm_service: terminus_spec_trace_replay
# Baseline for the spec/incremental optimization study. Same 8-task subset as
# terminus.nofault.auto.incremental_demo.{baseline,incremental}.yaml, but in
# the spec scenario where forks are created speculatively at LLM-pair time.
# Incremental process checkpointing is ON (so chain ancestors exist on disk),
# but none of the three fork-latency optimizations are enabled.
task_dataset: ../../../results/datasets/terminus_replay_spec_friendly.rstan_only.jsonl
sandboxes: 1
sandbox_resource_limits:
  cpus: 4
  memory_bytes: 8589934592
  pids_limit: 1024
max_workers: 1
phase_workers:
  setup: 1
  run: 1
  verification: 1
phase_merging:
  setup_and_run: true
  setup_and_run_executor_pool: shared
verification:
  enabled: true
executor:
  checkpoint_workers: 1
  restore_workers: 1
  checkpoint_queue_size: 16
  checkpoint_scheduling_policy: fifo
  reactive_checkpoint_urgent_quota: 1
  max_retries: 0
  retry_backoff_seconds: 0.05
  coordination_workers: 1
  composite_step_workers: 1
scheduler:
  min_checkpoint_interval_seconds: 0.0
  force_checkpoint_after_seconds: 0.0
  require_change_signal: true
  checkpoint_full_baseline_on_first_checkpoint: true
  prefer_checkpoint_during_llm_request: true
  require_llm_request_for_checkpoint: false
  inspect_without_pause: false
  incremental_process_enabled: true
  full_process_checkpoint_interval: 8
  max_process_chain_length: 16
llm_server:
  launch_mode: process
host_inspector:
  launch_mode: process
iterations: 0
output: ../../../logs/terminus/spec.auto.incremental_demo.rstan_smoke.baseline.csv
log_file: ../../../logs/terminus/spec.auto.incremental_demo.rstan_smoke.baseline.log
log_file_mode: write
log_level: info
telemetry:
  output: ../../../logs/terminus/spec.auto.incremental_demo.rstan_smoke.baseline.telemetry.jsonl
  file_mode: write
  detail_level: detailed
  capture_command_output: false
  max_text_attribute_bytes: 2048
  keep_in_memory_copy: false
  writer_mode: async
  queue_capacity: 16384000
  batch_max_records: 256000
  flush_interval_ms: 50
  overflow_policy: drop_new
  serializer: auto
  report:
    enabled: true
    output_dir: ../../../logs/terminus/spec.auto.incremental_demo.rstan_smoke.baseline.report
    top_k: 50
    log_scale_charts: false
    export_svg: true
monitoring:
  enabled: true
  sample_interval_ms: 5000
  include_host: true
  include_sandboxes: true
zpool_name: crabbench-300
reuse_zpool: true
benchmark_root: ../../../data/crab/results
max_agent_timeout_scale: 4.0
max_test_timeout_scale_overrides:
  pytorch-model-cli: 4.0
  sqlite-with-gcov: 2.0
scenario_options:
  acceptance_rate: 0.5
  draft_response_delay_scaling_factor: 0.1
  mismatch_policy: preserve_command_class
  # Pre-existing fork-reuse cache — kept on across all variants so the
  # comparison isolates the three new optimizations rather than mixing
  # in fork-reuse vs. no-reuse effects.
  enable_fork_reuse: true
  delete_filesystem_checkpoints: true
  # All three new fork-latency optimizations OFF.
  enable_fork_chain_sharing: false
  enable_background_prefork: false
  enable_lazy_restore: false
llm_service_options:
  response_delay_policy: trace_replay
  response_delay_scaling_factor: 1.0
