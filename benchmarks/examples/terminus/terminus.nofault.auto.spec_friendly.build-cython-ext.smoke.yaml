scenario: fault
mode: auto
provider: openai
agent: terminus
llm_service: terminus_trace_replay
task_dataset: /root/workspace/agent-cr/results/datasets/terminus_replay_spec_friendly.build-cython-ext.jsonl
sandboxes: 1
sandbox_resource_limits:
  cpus: 8
  memory_bytes: 17179869184
  pids_limit: 2048
max_workers: 1
phase_workers:
  setup: 1
  run: 1
  verification: 1
phase_merging:
  setup_and_run: true
  setup_and_run_executor_pool: shared
verification:
  enabled: true
executor:
  checkpoint_workers: 1
  restore_workers: 1
  checkpoint_queue_size: 32
  checkpoint_scheduling_policy: fifo
  reactive_checkpoint_urgent_quota: 1
  max_retries: 0
  retry_backoff_seconds: 0.05
  coordination_workers: 1
  composite_step_workers: 1
scheduler:
  min_checkpoint_interval_seconds: 0.0
  force_checkpoint_after_seconds: 0.0
  require_change_signal: true
  checkpoint_full_baseline_on_first_checkpoint: true
  prefer_checkpoint_during_llm_request: true
  require_llm_request_for_checkpoint: false
  inspect_without_pause: false
llm_server:
  launch_mode: process
host_inspector:
  launch_mode: process
iterations: 1
output: /root/workspace/agent-cr/logs/terminus/nofault.auto.spec_friendly.build-cython-ext.smoke.csv
log_file: /root/workspace/agent-cr/logs/terminus/nofault.auto.spec_friendly.build-cython-ext.smoke.log
log_file_mode: write
log_level: debug
telemetry:
  output: /root/workspace/agent-cr/logs/terminus/nofault.auto.spec_friendly.build-cython-ext.smoke.telemetry.jsonl
  file_mode: write
  detail_level: detailed
  capture_command_output: true
  max_text_attribute_bytes: 4096
  keep_in_memory_copy: false
  writer_mode: async
  queue_capacity: 16384000
  batch_max_records: 256000
  flush_interval_ms: 50
  overflow_policy: drop_new
  serializer: auto
  report:
    enabled: true
    output_dir: /root/workspace/agent-cr/logs/terminus/nofault.auto.spec_friendly.build-cython-ext.smoke.report
    top_k: 50
    log_scale_charts: false
    export_svg: true
monitoring:
  enabled: true
  sample_interval_ms: 1000
  include_host: true
  include_sandboxes: true
zpool_name: agentcrbench-300
reuse_zpool: true
benchmark_root: /root/workspace/agent-cr/data/agent_cr/results
max_agent_timeout_scale: 4.0
scenario_options:
  injection_rate: 0.0
  first_forced_event_chunk: 0
  delete_filesystem_checkpoints: true
llm_service_options:
  response_delay_policy: trace_replay
  response_delay_scaling_factor: 1.0
