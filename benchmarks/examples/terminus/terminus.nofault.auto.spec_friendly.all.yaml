scenario: fault
mode: auto
provider: openai
agent: terminus
llm_service: terminus_trace_replay
task_dataset: ../../../results/datasets/terminus_replay_spec_friendly.jsonl
sandboxes: 46
sandbox_resource_limits:
  cpus: 4
  memory_bytes: 8589934592
  pids_limit: 1024
max_workers: 32
phase_workers:
  setup: 32
  run: 32
  verification: 32
phase_merging:
  setup_and_run: true
  setup_and_run_executor_pool: shared
verification:
  enabled: true
executor:
  checkpoint_workers: 32
  restore_workers: 32
  checkpoint_queue_size: 256
  checkpoint_scheduling_policy: fifo
  reactive_checkpoint_urgent_quota: 32
  max_retries: 0
  retry_backoff_seconds: 0.05
  coordination_workers: 32
  composite_step_workers: 32
scheduler:
  min_checkpoint_interval_seconds: 0.0
  force_checkpoint_after_seconds: 0.0
  require_change_signal: true
  checkpoint_full_baseline_on_first_checkpoint: true
  prefer_checkpoint_during_llm_request: true
  require_llm_request_for_checkpoint: false
  inspect_without_pause: false
llm_server:
  launch_mode: process
host_inspector:
  launch_mode: process
iterations: 1
output: ../../../logs/terminus/nofault.auto.spec_friendly.all.csv
log_file: ../../../logs/terminus/nofault.auto.spec_friendly.all.log
log_file_mode: write
telemetry:
  output: ../../../logs/terminus/nofault.auto.spec_friendly.all.telemetry.jsonl
  file_mode: write
  detail_level: detailed
  capture_command_output: false
  max_text_attribute_bytes: 2048
  keep_in_memory_copy: false
  writer_mode: async
  queue_capacity: 16384000
  batch_max_records: 256000
  flush_interval_ms: 50
  overflow_policy: drop_new
  serializer: auto
  report:
    enabled: true
    output_dir: ../../../logs/terminus/nofault.auto.spec_friendly.all.report
    top_k: 50
    log_scale_charts: false
    export_svg: true
monitoring:
  enabled: true
  sample_interval_ms: 5000
  include_host: true
  include_sandboxes: true
zpool_name: crabbench-300
reuse_zpool: true
benchmark_root: ../../../data/crab/results
log_level: info
max_agent_timeout_scale: 4.0
# Per-task verification-timeout scale overrides. pytorch-model-cli's
# recorded `max_test_timeout_sec` is 180s, calibrated against an
# uncapped baseline; on our 4-CPU cgroup it consistently exceeds 180s
# even after the trace replay finishes (cursor=N/N). Bumping its scale
# to 4.0 → 720s gets the verification subprocess past install + test.
max_test_timeout_scale_overrides:
  pytorch-model-cli: 4.0
  # sqlite-with-gcov: under 32-concurrent setup, the verification shim's
  # apt-get install + uv install contend on network/disk and overshoot
  # the 180s budget right at the final shim install step. 14-concurrent
  # passes the same test cleanly (failed14 run); 32-concurrent needs
  # the wider budget. Bumping to 2.0 → 360s cleared this last flake.
  sqlite-with-gcov: 2.0
scenario_options:
  injection_rate: 0.0
  first_forced_event_chunk: 0
  delete_filesystem_checkpoints: true
llm_service_options:
  response_delay_policy: trace_replay
  response_delay_scaling_factor: 1.0
