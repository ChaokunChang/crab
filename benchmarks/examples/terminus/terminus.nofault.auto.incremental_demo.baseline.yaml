scenario: fault
mode: auto
provider: openai
agent: terminus
llm_service: terminus_trace_replay
# Curated 8-task subset chosen for high process-checkpoint frequency and/or
# large memory footprint — the workloads where CRIU incremental dumps are
# expected to pay off most. See companion incremental.yaml for the enabled
# variant; these two files differ only in scheduler.incremental_process_enabled.
task_dataset: ../../../results/datasets/terminus_replay_spec_friendly.incremental_demo.jsonl
sandboxes: 8
sandbox_resource_limits:
  cpus: 4
  memory_bytes: 8589934592
  pids_limit: 1024
max_workers: 8
phase_workers:
  setup: 8
  run: 8
  verification: 8
phase_merging:
  setup_and_run: true
  setup_and_run_executor_pool: shared
verification:
  enabled: true
executor:
  checkpoint_workers: 8
  restore_workers: 8
  checkpoint_queue_size: 64
  checkpoint_scheduling_policy: fifo
  reactive_checkpoint_urgent_quota: 8
  max_retries: 0
  retry_backoff_seconds: 0.05
  coordination_workers: 8
  composite_step_workers: 8
scheduler:
  min_checkpoint_interval_seconds: 0.0
  force_checkpoint_after_seconds: 0.0
  require_change_signal: true
  checkpoint_full_baseline_on_first_checkpoint: true
  prefer_checkpoint_during_llm_request: true
  require_llm_request_for_checkpoint: false
  inspect_without_pause: false
  # Baseline: incremental disabled. Every process checkpoint is a full CRIU dump.
  incremental_process_enabled: false
llm_server:
  launch_mode: process
host_inspector:
  launch_mode: process
iterations: 1
output: ../../../logs/terminus/nofault.auto.incremental_demo.baseline.csv
log_file: ../../../logs/terminus/nofault.auto.incremental_demo.baseline.log
log_file_mode: write
log_level: info
telemetry:
  output: ../../../logs/terminus/nofault.auto.incremental_demo.baseline.telemetry.jsonl
  file_mode: write
  detail_level: detailed
  capture_command_output: false
  max_text_attribute_bytes: 2048
  keep_in_memory_copy: false
  writer_mode: async
  queue_capacity: 16384000
  batch_max_records: 256000
  flush_interval_ms: 50
  overflow_policy: drop_new
  serializer: auto
  report:
    enabled: true
    output_dir: ../../../logs/terminus/nofault.auto.incremental_demo.baseline.report
    top_k: 50
    log_scale_charts: false
    export_svg: true
monitoring:
  enabled: true
  sample_interval_ms: 5000
  include_host: true
  include_sandboxes: true
zpool_name: crabbench-300
reuse_zpool: true
benchmark_root: ../../../data/crab/results
max_agent_timeout_scale: 4.0
max_test_timeout_scale_overrides:
  pytorch-model-cli: 4.0
  sqlite-with-gcov: 2.0
scenario_options:
  injection_rate: 0.0
  first_forced_event_chunk: 0
  delete_filesystem_checkpoints: true
llm_service_options:
  response_delay_policy: trace_replay
  response_delay_scaling_factor: 1.0
