scenario: fault
mode: auto
provider: openai
agent: terminus
llm_service: terminus_trace_replay
task_dataset: /root/workspace/crab/results/datasets/terminus_replay_spec_friendly.failed14.jsonl
sandboxes: 14
# Bump per-sandbox CPU 4 → 8 and memory 8 GiB → 16 GiB. 14 × 8 = 112 CPUs
# fits in 128-host; 14 × 16 GiB = 224 GiB fits in 495 GiB.
sandbox_resource_limits:
  cpus: 8
  memory_bytes: 17179869184
  pids_limit: 2048
max_workers: 14
phase_workers:
  setup: 14
  run: 14
  verification: 14
phase_merging:
  setup_and_run: true
  setup_and_run_executor_pool: shared
verification:
  enabled: true
executor:
  checkpoint_workers: 14
  restore_workers: 14
  checkpoint_queue_size: 256
  checkpoint_scheduling_policy: fifo
  reactive_checkpoint_urgent_quota: 14
  max_retries: 0
  retry_backoff_seconds: 0.05
  coordination_workers: 14
  composite_step_workers: 14
scheduler:
  min_checkpoint_interval_seconds: 0.0
  force_checkpoint_after_seconds: 0.0
  require_change_signal: true
  checkpoint_full_baseline_on_first_checkpoint: true
  prefer_checkpoint_during_llm_request: true
  require_llm_request_for_checkpoint: false
  inspect_without_pause: false
llm_server:
  launch_mode: process
host_inspector:
  launch_mode: process
iterations: 1
output: /root/workspace/crab/logs/terminus/nofault.auto.spec_friendly.failed14.csv
log_file: /root/workspace/crab/logs/terminus/nofault.auto.spec_friendly.failed14.log
log_file_mode: write
telemetry:
  output: /root/workspace/crab/logs/terminus/nofault.auto.spec_friendly.failed14.telemetry.jsonl
  file_mode: write
  detail_level: detailed
  capture_command_output: false
  max_text_attribute_bytes: 2048
  keep_in_memory_copy: false
  writer_mode: async
  queue_capacity: 16384000
  batch_max_records: 256000
  flush_interval_ms: 50
  overflow_policy: drop_new
  serializer: auto
  report:
    enabled: true
    output_dir: /root/workspace/crab/logs/terminus/nofault.auto.spec_friendly.failed14.report
    top_k: 50
    log_scale_charts: false
    export_svg: true
monitoring:
  enabled: true
  sample_interval_ms: 5000
  include_host: true
  include_sandboxes: true
zpool_name: crabbench-300
reuse_zpool: true
benchmark_root: /root/workspace/crab/data/crab/results
log_level: info
max_agent_timeout_scale: 4.0
scenario_options:
  injection_rate: 0.0
  first_forced_event_chunk: 0
  delete_filesystem_checkpoints: true
llm_service_options:
  response_delay_policy: trace_replay
  response_delay_scaling_factor: 1.0
