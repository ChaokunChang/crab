[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crab"
version = "0.1.0"
description = "Fault-tolerant agent execution via process and filesystem checkpointing."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Crab contributors" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
# Operator CLI — talks to the daemon over the Unix-domain socket.
# Subcommands: daemon start/stop/status, info, sandbox run/ls/rm/exec/stop/pause/resume,
# checkpoint create/ls/rm/restore. See `crab --help`.
crab = "crab.cli:main"

# Daemon entry point. Equivalent to `python -m crab.daemon`.
# Typically wrapped by a systemd unit; for development, prefer
# `crab daemon start [--foreground]`.
crabd = "crab.daemon.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crab*", "integrations*", "benchmarks*"]
exclude = ["integrations.sandboxes.iflow.cache.prepared-runtimes*"]

[tool.setuptools.package-data]
"crab" = ["host_inspector/bpf/*"]
"integrations.sandboxes.iflow" = ["Dockerfile", "cache/*.tar.xz", "cache/*.tgz"]
